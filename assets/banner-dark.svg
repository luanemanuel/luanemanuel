        <circle cx="0" cy="0" r="4" fill="#38BDF8" />
      </g>

      <circle cx="-102" cy="-44" r="3" fill="#38BDF8" />
      <circle cx="102" cy="-44" r="3" fill="#38BDF8" />
      <circle cx="-102" cy="0" r="2.5" fill="#818CF8" />
      <circle cx="102" cy="0" r="2.5" fill="#818CF8" />
      <circle cx="-102" cy="44" r="2.5" fill="#64748B" />
      <circle cx="102" cy="44" r="2.5" fill="#64748B" />
