<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Luan Emanuel — Software Engineer</title>
  <desc id="desc">Software Engineer focused on Mobile Architecture, Full-Stack Systems, and DevOps &amp; Cloud.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="55%" stop-color="#0E172A" />
      <stop offset="100%" stop-color="#111C33" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="80%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAccent" cx="86%" cy="76%" r="36%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.55" />
    </pattern>
    <linearGradient id="gridMaskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>
    <mask id="gridMask">
      <rect width="1200" height="260" fill="url(#gridMaskGrad)" />
    </mask>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="1199" height="259" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
