<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
  <title id="title">Luan Emanuel — Software Engineer</title>
  <desc id="desc">Software Engineer focused on Mobile Architecture, Full-Stack Systems, and DevOps &amp; Cloud.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="55%" stop-color="#0E172A" />
      <stop offset="100%" stop-color="#111C33" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="82%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAccent" cx="86%" cy="78%" r="36%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.55" />
    </pattern>
    <linearGradient id="gridMaskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>
    <mask id="gridMask">
      <rect width="960" height="230" fill="url(#gridMaskGrad)" />
    </mask>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="959" height="229" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="960" height="230" fill="url(#bg)" />
    <rect width="960" height="230" fill="url(#grid)" mask="url(#gridMask)" />
    <rect width="960" height="230" fill="url(#glowBlue)" />
    <rect width="960" height="230" fill="url(#glowAccent)" />

    <g transform="translate(790, 116)">
      <line x1="-90" y1="-38" x2="-90" y2="38" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 4" />
      <line x1="90" y1="-38" x2="90" y2="38" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 4" />
      <line x1="0" y1="-74" x2="0" y2="74" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="3 4" />

      <g transform="translate(0, 38)">
        <polygon points="0,-36 90,0 0,36 -90,0" fill="#0F172A" fill-opacity="0.88" stroke="#475569" stroke-width="1.4" />
        <polygon points="0,-24 60,0 0,24 -60,0" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
      </g>

      <g transform="translate(0, 0)">
        <polygon points="0,-36 90,0 0,36 -90,0" fill="#171934" fill-opacity="0.86" stroke="#818CF8" stroke-width="1.5" />
        <line x1="-34" y1="-4" x2="16" y2="-4" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
        <line x1="-20" y1="6" x2="30" y2="6" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" />
      </g>

      <g transform="translate(0, -38)">
        <polygon points="0,-36 90,0 0,36 -90,0" fill="#0C243D" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.8" />
        <polygon points="0,-20 50,0 0,20 -50,0" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.55" />
        <circle cx="0" cy="0" r="3.8" fill="#38BDF8" />
      </g>

      <circle cx="-90" cy="-38" r="2.8" fill="#38BDF8" />
      <circle cx="90" cy="-38" r="2.8" fill="#38BDF8" />
      <circle cx="-90" cy="0" r="2.4" fill="#818CF8" />
      <circle cx="90" cy="0" r="2.4" fill="#818CF8" />
      <circle cx="-90" cy="38" r="2.4" fill="#64748B" />
      <circle cx="90" cy="38" r="2.4" fill="#64748B" />
    </g>

    <circle cx="52" cy="48" r="4" fill="#38BDF8" />
    <text x="66" y="53" fill="#38BDF8" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="600" letter-spacing="2.2">SOFTWARE ENGINEER</text>

    <text x="48" y="106" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.8">Luan Emanuel</text>

    <text x="48" y="139" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17.5" font-weight="400">Mobile Architecture · Full-Stack Systems · DevOps &amp; Cloud</text>

    <g font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" fill="#E2E8F0">
      <rect x="48" y="162" width="150" height="34" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
      <text x="123" y="184" text-anchor="middle">Flutter &amp; Dart</text>

      <rect x="210" y="162" width="92" height="34" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
      <text x="256" y="184" text-anchor="middle">NestJS</text>

      <rect x="314" y="162" width="142" height="34" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
      <text x="385" y="184" text-anchor="middle">Docker &amp; AWS</text>
    </g>
