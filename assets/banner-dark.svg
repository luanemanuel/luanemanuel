        <line x1="-38" y1="-4" x2="18" y2="-4" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
        <line x1="-22" y1="6" x2="34" y2="6" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" />
