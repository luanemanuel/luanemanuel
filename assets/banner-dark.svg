    <rect width="1200" height="260" fill="url(#grid)" mask="url(#gridMask)" />
    <rect width="1200" height="260" fill="url(#glowBlue)" />
    <rect width="1200" height="260" fill="url(#glowAccent)" />

    <g transform="translate(965, 132)">
      <line x1="-102" y1="-44" x2="-102" y2="44" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 4" />
      <line x1="102" y1="-44" x2="102" y2="44" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 4" />
      <line x1="0" y1="-86" x2="0" y2="86" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="3 4" />

      <g transform="translate(0, 44)">
        <polygon points="0,-42 102,0 0,42 -102,0" fill="#0F172A" fill-opacity="0.88" stroke="#475569" stroke-width="1.4" />
        <polygon points="0,-28 68,0 0,28 -68,0" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
      </g>

      <g transform="translate(0, 0)">
