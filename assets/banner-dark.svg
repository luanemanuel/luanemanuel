    <circle cx="68" cy="64" r="4" fill="#38BDF8" />
    <text x="82" y="69" fill="#38BDF8" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.4">SOFTWARE ENGINEER</text>

    <text x="64" y="124" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-0.8">Luan Emanuel</text>

    <text x="64" y="159" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">Mobile Architecture · Full-Stack Systems · DevOps &amp; Cloud</text>

    <g font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="500" fill="#CBD5E1">
